<div class="min-h-screen bg-gray-950 flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-black text-red-600 uppercase tracking-tight">All-Star Sports Bar</h1>
      <p class="mt-2 text-gray-400">Admin Portal</p>
    </div>

    <div class="bg-gray-900 rounded-2xl border border-gray-700 p-8 shadow-2xl">
      <h2 class="text-2xl font-bold text-white mb-6">Sign In</h2>

      @if (authService.isSignedInWithoutAccess()) {
        <div class="mb-4 rounded-lg bg-red-900/50 border border-red-700 px-4 py-3 text-red-300 text-sm">
          {{ authService.userName() }} does not have admin access. Ask the site owner to invite you.
        </div>
        <button
          type="button"
          (click)="signOut()"
          class="w-full bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 rounded-lg transition-colors"
        >
          Sign out
        </button>
      } @else {
        <button
          type="button"
          (click)="signIn()"
          class="w-full bg-red-700 hover:bg-red-600 text-white font-bold py-3 rounded-lg transition-colors"
        >
          Sign in with GitHub
        </button>
        <p class="mt-4 text-sm text-gray-400 text-center">
          Forgot your password? Reset it with your GitHub account.
        </p>
      }
    </div>
  </div>
</div>
